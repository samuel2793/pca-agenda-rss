name: Keep scheduled workflows active

on:
  workflow_dispatch:
  schedule:
    # Un commit mensual evita que un repositorio público quede 60 días sin actividad
    # y GitHub desactive automáticamente sus workflows programados.
    - cron: "43 6 1 * *"

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Update heartbeat
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git commit -m "chore: keep scheduled workflows active"
          git push
